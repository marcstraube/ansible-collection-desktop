---
# =============================================================================
# Desktop Workstation Tasks
# =============================================================================
# Task file for desktop workstation configuration — single source of truth.
# Imported by playbooks/desktop_workstation.yml (standalone) and infra playbooks.
#
# Each role's defaults/main.yml decides whether it runs (`<role>_enabled`):
# core desktop roles are on, application and peripheral roles are opt-in.
# Override per host/group via inventory. See each role's defaults/main.yml
# for available variables.
#
# Tag scheme:
#   desktop         All roles in this file
#   <role-name>     Individual role (e.g., browser, terminal)
#   <role>:<phase>  Role sub-stage (e.g., browser:configure, browser:install)
#
# Roles are imported statically (import_role) so their internal sub-tags are
# exposed to --tags / --list-tags. Run `ansible-playbook … --list-tags` to see
# the full set. Dynamic include_role would hide sub-tags behind the include.
#
# The import condition reads the role toggle without a default(): under
# import_role the condition is evaluated with the role defaults in scope, so a
# playbook default() would never apply.
# =============================================================================

#
# Desktop Environment
#
- name: Desktop | Import desktop_environment role
  ansible.builtin.import_role:
    name: marcstraube.desktop.desktop_environment
  tags:
    - desktop
    - desktop-environment
  when: desktop_environment_enabled | bool

- name: Desktop | Import display_manager role
  ansible.builtin.import_role:
    name: marcstraube.desktop.display_manager
  tags:
    - desktop
    - display-manager
  when: display_manager_enabled | bool

