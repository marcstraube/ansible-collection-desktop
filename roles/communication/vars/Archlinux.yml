---
#
# Archlinux-Specific Variables
#

# Telegram package
__communication_telegram_package: 'telegram-desktop'

# Signal package
__communication_signal_package: 'signal-desktop'

# Discord package
__communication_discord_package: 'discord'

# Element package
__communication_element_package: 'element-desktop'

# Sieve email filtering (KDE PIM suite includes sieve editor)
__communication_sieve_package: 'kmail'

# KDE Connect package
__communication_kdeconnect_package: 'kdeconnect'

# TODO(4.0): remove — replaced by slack-desktop, which runs on Wayland natively
__communication_slack_superseded_packages:
  - slack-desktop-wayland

#
# AUR Packages
#

__communication_aur_packages:
  slack:
    - slack-desktop
  threema:
    - threema-desktop-bin
  zoom:
    - zoom
  teams:
    - teams-for-linux
  jitsi:
    - jitsi-meet-desktop
