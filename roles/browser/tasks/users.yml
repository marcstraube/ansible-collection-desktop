---
# Respects mode: managed | initial | seed | disabled. Whole-file deploys
# (user.js, chromium-flags.conf) honour seed via force: false (deploy if
# absent, never overwrite). mimeapps.list manages individual handler keys
# rather than a whole file, so it treats seed like initial.

- name: Users | Bootstrap Firefox profile
  ansible.builtin.include_tasks:
    file: users_firefox_family.yml
    apply:
      tags:
        - browser
        - browser:configure
  vars:
    __ff_config_dir: '.mozilla/firefox'
    __ff_profile_pattern: '{{ __browser_firefox_profile_pattern }}'
    __ff_profile_dirname: '{{ __browser_firefox_profile_dirname }}'
    __ff_install_hash: '{{ __browser_firefox_install_hash }}'
    __ff_profile_name: 'default-release'
    __ff_preferences: '{{ browser_firefox_preferences }}'
  tags:
    - browser
    - browser:configure
  loop: '{{ browser_users }}'
  loop_control:
    loop_var: browser_user
    label: '{{ browser_user.username }}'
  when:
    - browser_firefox_enabled | bool
    - browser_firefox_user_js_enabled | bool
    - (browser_user.mode | default(browser_user_config_mode)) != 'disabled'
    - >-
      (browser_user.mode | default(browser_user_config_mode)) in ['managed', 'seed']
      or ((browser_user.mode | default(browser_user_config_mode)) == 'initial'
          and browser_user.username in (__users_newly_created | default([])))

- name: Users | Bootstrap LibreWolf profile
  ansible.builtin.include_tasks:
    file: users_firefox_family.yml
    apply:
      tags:
        - browser
        - browser:configure
  vars:
    __ff_config_dir: '.librewolf'
    __ff_profile_pattern: '{{ __browser_librewolf_profile_pattern }}'
    __ff_profile_dirname: '{{ __browser_librewolf_profile_dirname }}'
    __ff_install_hash: '{{ __browser_librewolf_install_hash }}'
    __ff_profile_name: 'default'
    __ff_preferences: '{{ browser_librewolf_preferences }}'
  tags:
    - browser
    - browser:configure
  loop: '{{ browser_users }}'
  loop_control:
    loop_var: browser_user
    label: '{{ browser_user.username }}'
  when:
    - browser_librewolf_enabled | bool
    - browser_librewolf_user_js_enabled | bool
    - ansible_facts['os_family'] == 'Archlinux'
    - (browser_user.mode | default(browser_user_config_mode)) != 'disabled'
    - >-
      (browser_user.mode | default(browser_user_config_mode)) in ['managed', 'seed']
      or ((browser_user.mode | default(browser_user_config_mode)) == 'initial'
          and browser_user.username in (__users_newly_created | default([])))

- name: Users | Deploy Chromium launch switches
  ansible.builtin.include_tasks:
    file: users_chromium.yml
    apply:
      tags:
        - browser
        - browser:configure
  tags:
    - browser
    - browser:configure
  loop: '{{ browser_users }}'
  loop_control:
    loop_var: browser_user
    label: '{{ browser_user.username }}'
  when:
    - browser_chromium_enabled | bool
    - browser_chromium_flags_enabled | bool
    - browser_chromium_flags | length > 0
    - (browser_user.mode | default(browser_user_config_mode)) != 'disabled'
    - >-
      (browser_user.mode | default(browser_user_config_mode)) in ['managed', 'seed']
      or ((browser_user.mode | default(browser_user_config_mode)) == 'initial'
          and browser_user.username in (__users_newly_created | default([])))

- name: Users | Deploy Chrome launch switches
  ansible.builtin.include_tasks:
    file: users_chrome.yml
    apply:
      tags:
        - browser
        - browser:configure
  tags:
    - browser
    - browser:configure
  loop: '{{ browser_users }}'
  loop_control:
    loop_var: browser_user
    label: '{{ browser_user.username }}'
  when:
    - browser_chrome_enabled | bool
    - browser_chrome_flags_enabled | bool
    - browser_chrome_flags | length > 0
    - (browser_user.mode | default(browser_user_config_mode)) != 'disabled'
    - >-
      (browser_user.mode | default(browser_user_config_mode)) in ['managed', 'seed']
      or ((browser_user.mode | default(browser_user_config_mode)) == 'initial'
          and browser_user.username in (__users_newly_created | default([])))

- name: Users | Include default browser handler config
  ansible.builtin.include_tasks:
    file: users_default_handler.yml
    apply:
      tags:
        - browser
        - browser:configure
        - browser:default
  tags:
    - browser
    - browser:configure
    - browser:default
  loop: '{{ browser_users }}'
  loop_control:
    loop_var: browser_user
    label: '{{ browser_user.username }}'
  when:
    - browser_default | length > 0
    - (browser_user.mode | default(browser_user_config_mode)) != 'disabled'
    - >-
      (browser_user.mode | default(browser_user_config_mode)) == 'managed'
      or ((browser_user.mode | default(browser_user_config_mode)) in ['initial', 'seed']
          and browser_user.username in (__users_newly_created | default([])))
