---
#
# Firefox
#

- name: Install | Firefox packages
  ansible.builtin.package:
    name: '{{ __browser_firefox_package }}'
    state: present
  when: browser_firefox_enabled | bool
  retries: 3
  delay: 5

- name: Install | Firefox language pack
  ansible.builtin.package:
    name: '{{ __browser_firefox_i18n_package }}'
    state: present
  when:
    - browser_firefox_enabled | bool
    - browser_firefox_i18n | length > 0
  retries: 3
  delay: 5

#
# LibreWolf (official repository on Arch, not available elsewhere)
#

# TODO(4.0): remove — LibreWolf moved from the AUR to extra. Removal runs
# first so the install does not hit a file conflict with the old package.
- name: Install | Remove superseded LibreWolf packages (Arch)
  community.general.pacman:
    name: '{{ __browser_librewolf_superseded_packages }}'
    state: absent
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - browser_librewolf_enabled | bool
    - __browser_librewolf_superseded_packages | length > 0

# TODO(4.0): remove — earlier releases wrote the policies into the package's
# distribution directory. A file there that no package owns blocks the
# install of the official package with a file conflict.
- name: Install | Check legacy LibreWolf policies file
  ansible.builtin.stat:
    path: '{{ __browser_librewolf_legacy_policies_file }}'
  register: __browser_librewolf_legacy_policies
  when:
    - browser_librewolf_enabled | bool
    - __browser_librewolf_legacy_policies_file | length > 0

- name: Install | Check owner of legacy LibreWolf policies file (Arch)
  ansible.builtin.command:
    cmd: 'pacman -Qqo {{ __browser_librewolf_legacy_policies_file }}'
  register: __browser_librewolf_legacy_policies_owner
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - browser_librewolf_enabled | bool
    - __browser_librewolf_legacy_policies.stat.exists | default(false)

- name: Install | Remove unowned legacy LibreWolf policies file
  ansible.builtin.file:
    path: '{{ __browser_librewolf_legacy_policies_file }}'
    state: absent
  when:
    - browser_librewolf_enabled | bool
    - __browser_librewolf_legacy_policies.stat.exists | default(false)
    - __browser_librewolf_legacy_policies_owner.rc | default(0) != 0

- name: Install | LibreWolf packages
  ansible.builtin.package:
    name: '{{ __browser_librewolf_package }}'
    state: present
  when:
    - browser_librewolf_enabled | bool
    - __browser_librewolf_package | length > 0
  retries: 3
  delay: 5

- name: Install | LibreWolf not available notice
  ansible.builtin.debug:
    msg: >-
      LibreWolf is not available in standard repositories for
      {{ ansible_facts["os_family"] }}. Please install manually or via Flatpak.
  when:
    - browser_librewolf_enabled | bool
    - __browser_librewolf_package | length == 0

#
# Chromium
#

- name: Install | Chromium packages
  ansible.builtin.package:
    name: '{{ __browser_chromium_package }}'
    state: present
  when: browser_chromium_enabled | bool
  retries: 3
  delay: 5

#
# Brave (AUR on Arch, not available elsewhere)
#

- name: Install | Brave from AUR (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __browser_aur_packages.brave }}'
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - browser_brave_enabled | bool
  retries: 3
  delay: 5

- name: Install | Brave not available notice
  ansible.builtin.debug:
    msg: >-
      Brave is not available in standard repositories for
      {{ ansible_facts["os_family"] }}. Please install manually or via Flatpak.
  when:
    - ansible_facts['os_family'] != 'Archlinux'
    - browser_brave_enabled | bool

#
# Google Chrome (AUR on Arch, Google's own vendor package on Debian/EL).
# On Debian/EL the google-chrome package's post-install script installs and
# owns Google's apt/yum repository and signing key, so Chrome updates through
# the normal system upgrade path. Installing the vendor package directly
# avoids a second, conflicting Ansible-managed repository entry: Google's
# post-install script recreates its own repo file (same name) on every
# install, which would break idempotency.
#

- name: Install | Google Chrome from AUR (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __browser_aur_packages.chrome }}'
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - browser_chrome_enabled | bool
  retries: 3
  delay: 5

- name: Install | Google Chrome vendor package (Debian)
  ansible.builtin.apt:
    deb: '{{ __browser_chrome_deb_url }}'
    state: present
  when:
    - ansible_facts['os_family'] == 'Debian'
    - browser_chrome_enabled | bool
  retries: 3
  delay: 5

- name: Install | Import Google Chrome signing key (RedHat)
  ansible.builtin.rpm_key:
    key: '{{ __browser_chrome_gpg_url }}'
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - browser_chrome_enabled | bool
  retries: 3
  delay: 5

- name: Install | Google Chrome vendor package (RedHat)
  ansible.builtin.dnf:
    name: '{{ __browser_chrome_rpm_url }}'
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - browser_chrome_enabled | bool
  retries: 3
  delay: 5

#
# Tor Browser
#

- name: Install | Import Tor Browser GPG key (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      gpg --keyserver hkps://keys.openpgp.org \
        --recv-keys EF6E286DDA85EA2A4BA7DE684E2C6E8793298290 2>/dev/null || \
      gpg --keyserver hkps://keyserver.ubuntu.com \
        --recv-keys EF6E286DDA85EA2A4BA7DE684E2C6E8793298290
  register: __browser_tor_gpg
  changed_when: "'imported' in __browser_tor_gpg.stderr"
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - browser_tor_enabled | bool

- name: Install | Tor Browser from AUR (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __browser_aur_packages.tor }}'
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - browser_tor_enabled | bool
  retries: 3
  delay: 5

- name: Install | Tor Browser packages
  ansible.builtin.package:
    name: '{{ __browser_tor_package }}'
    state: present
  when:
    - ansible_facts['os_family'] != 'Archlinux'
    - browser_tor_enabled | bool
    - __browser_tor_package | length > 0
  retries: 3
  delay: 5

#
# Zen Browser (AUR on Arch only)
#

- name: Install | Zen Browser from AUR (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __browser_aur_packages.zen }}'
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - browser_zen_enabled | bool
  retries: 3
  delay: 5

- name: Install | Zen Browser not available notice
  ansible.builtin.debug:
    msg: >-
      Zen Browser is not available for {{ ansible_facts["os_family"] }}.
      Please install via Flatpak or AppImage.
  when:
    - ansible_facts['os_family'] != 'Archlinux'
    - browser_zen_enabled | bool
