---
#
# AI Tools Main Tasks
#

# ai_users takes precedence; only derive when the operator left it empty.
- name: Main | Set user derivation guard
  ansible.builtin.set_fact:
    __ai_derive_users: '{{ ai_users | length == 0 }}'
  tags:
    - always

# The ai attribute marks an account as a user of the AI desktop tooling.
# Only the name is consumed here; per-user settings live in ai_users.
# Same derivation contract as the other per-user roles.
- name: Main | Derive AI users from users_list (exclude system users)
  ansible.builtin.set_fact:
    ai_users: >-
      {{ ai_users + [{'username': item.name}] }}
  loop: >-
    {{ users_list | default([]) | selectattr('ai', 'defined') | list }}
  loop_control:
    label: '{{ item.name }}'
  when:
    - ai_enabled | bool
    - __ai_derive_users | default(false) | bool
    - not (item.system | default(false) | bool)
  tags:
    - always

# Deriving ai_users from the users_list ai attribute is deprecated and will
# be removed in v4.0.0. The flag is set on every run so the warning below
# fires only while the deprecated path is in use.
- name: Main | Detect deprecated ai attribute on users_list
  ansible.builtin.set_fact:
    __ai_users_list_attribute_deprecated: >-
      {{ ai_enabled | bool
         and __ai_derive_users | default(false) | bool
         and users_list | default([]) | selectattr('ai', 'defined') | list | length > 0 }}
  tags:
    - always

- name: Main | Warn about users_list ai attribute deprecation
  ansible.builtin.debug:
    msg: >
      Deriving ai_users from the users_list ai attribute is DEPRECATED and
      will be removed in v4.0.0. Set ai_users instead. See #304.
  when: __ai_users_list_attribute_deprecated | bool
  tags:
    - always

# TODO(4.0): remove the ai_comfyui_gpu fallback and its warning.
# ai_comfyui_gpu took vendor names; map them to the backend names.
- name: Main | Handle deprecated ai_comfyui_gpu
  ansible.builtin.set_fact:
    ai_comfyui_backend: >-
      {{ {'nvidia': 'cuda', 'amd': 'rocm', 'cpu': 'cpu'}.get(ai_comfyui_gpu, ai_comfyui_gpu) }}
  when:
    - ai_enabled | bool
    - ai_comfyui_gpu is defined
  tags:
    - always

- name: Main | Warn about deprecated ai_comfyui_gpu
  ansible.builtin.debug:
    msg: >-
      ai_comfyui_gpu is DEPRECATED and will be removed in v4.0.0. Use
      ai_comfyui_backend instead ('nvidia' becomes 'cuda', 'amd' becomes
      'rocm', 'cpu' stays 'cpu').
  when:
    - ai_enabled | bool
    - ai_comfyui_gpu is defined
  tags:
    - always

# ai_ollama_backend takes one backend or a list of them. A string is also a
# sequence in Jinja, so only a real list is kept as is; every other value is
# wrapped and then fails the check below unless it is a valid backend name.
- name: Main | Normalize ai_ollama_backend to a list
  ansible.builtin.set_fact:
    __ai_ollama_backends: >-
      {{ ai_ollama_backend
         if (ai_ollama_backend is sequence
             and ai_ollama_backend is not string
             and ai_ollama_backend is not mapping)
         else [ai_ollama_backend] }}
  when:
    - ai_enabled | bool
    - ai_ollama_enabled | bool
  tags:
    - always

- name: Main | Validate ai_ollama_backend
  ansible.builtin.assert:
    that:
      - __ai_ollama_backends | length > 0
      - >-
        __ai_ollama_backends
        | reject('in', ['rocm', 'vulkan', 'cuda', 'cpu'])
        | list | length == 0
    fail_msg: >-
      ai_ollama_backend must be 'rocm', 'vulkan', 'cuda' or 'cpu', or a
      non-empty list of them, got '{{ ai_ollama_backend }}'
  when:
    - ai_enabled | bool
    - ai_ollama_enabled | bool
  tags:
    - always

- name: Main | Validate ai_ollama_environment
  ansible.builtin.assert:
    that:
      - ai_ollama_environment is mapping
    fail_msg: >-
      ai_ollama_environment must be a mapping of environment variables,
      got '{{ ai_ollama_environment }}'
  when:
    - ai_enabled | bool
    - ai_ollama_enabled | bool
  tags:
    - always

# The dedicated variables render the same environment keys; setting both
# would leave it to the order of the drop-in which one wins.
- name: Main | Validate Ollama directory and address settings
  ansible.builtin.assert:
    that:
      - not (ai_ollama_models_dir | length > 0 and 'OLLAMA_MODELS' in ai_ollama_environment)
      - >-
        not ((ai_ollama_host | length > 0 or ai_ollama_port | int != 11434)
             and 'OLLAMA_HOST' in ai_ollama_environment)
      - ai_ollama_models_dir | length == 0 or ai_ollama_models_dir is match('/')
      - ai_ollama_port | int > 0
    fail_msg: >-
      Set the Ollama model directory either with ai_ollama_models_dir or with
      OLLAMA_MODELS in ai_ollama_environment, and the listen address either
      with ai_ollama_host/ai_ollama_port or with OLLAMA_HOST, not both.
      ai_ollama_models_dir must be an absolute path and ai_ollama_port a port
      number.
  when:
    - ai_enabled | bool
    - ai_ollama_enabled | bool
  tags:
    - always

- name: Main | Validate per-user config modes
  ansible.builtin.assert:
    that:
      - >-
        [ai_user_config_mode, ai_claude_desktop_user_config_mode,
         ai_aider_user_config_mode, ai_opencode_user_config_mode,
         ai_lmstudio_user_config_mode]
        | reject('in', ['managed', 'merged', 'initial', 'disabled'])
        | list | length == 0
      - >-
        ai_users | selectattr('mode', 'defined') | map(attribute='mode')
        | reject('in', ['managed', 'merged', 'initial', 'disabled'])
        | list | length == 0
    fail_msg: >-
      ai_user_config_mode, the ai_<tool>_user_config_mode defaults and every
      ai_users mode must be 'managed', 'merged', 'initial' or 'disabled'
  when: ai_enabled | bool
  tags:
    - always

- name: Main | Validate OpenCode providers
  ansible.builtin.assert:
    that:
      - ai_opencode_providers is mapping
      - >-
        ai_opencode_providers.values() | rejectattr('base_url', 'defined') | list | length == 0
      - >-
        ai_opencode_providers.values() | map(attribute='models', default=[])
        | flatten | rejectattr('id', 'defined') | list | length == 0
      # OpenCode drops or rejects a model limit without both values
      - >-
        __ai_opencode_models | selectattr('context', 'defined')
        | rejectattr('output', 'defined') | list | length == 0
        and __ai_opencode_models | selectattr('output', 'defined')
        | rejectattr('context', 'defined') | list | length == 0
      - ai_opencode_model | length == 0 or '/' in ai_opencode_model
    fail_msg: >-
      ai_opencode_providers must map provider names to entries with a
      base_url and a list of models, each with an id and either both or none
      of context and output; ai_opencode_model must be
      '<provider>/<model id>'
  vars:
    __ai_opencode_models: >-
      {{ ai_opencode_providers.values() | map(attribute='models', default=[])
         | flatten }}
  when:
    - ai_enabled | bool
    - ai_opencode_enabled | bool
  tags:
    - always

- name: Main | Validate LM Studio models
  ansible.builtin.assert:
    that:
      - >-
        ai_lmstudio_models | rejectattr('repo', 'defined') | list | length == 0
        and ai_lmstudio_models | rejectattr('file', 'defined') | list | length == 0
      - ai_lmstudio_ollama_models | length == 0 or ai_ollama_enabled | bool
    fail_msg: >-
      Every ai_lmstudio_models entry needs a repo and a file;
      ai_lmstudio_ollama_models needs ai_ollama_enabled, since the links
      point into the local Ollama model directory
  when:
    - ai_enabled | bool
    - ai_lmstudio_enabled | bool
  tags:
    - always

# ai_whisper_backend takes one backend or a list of them. A string is also a
# sequence in Jinja, so only a real list is kept as is; every other value is
# wrapped and then fails the check below unless it is a valid backend name.
- name: Main | Normalize ai_whisper_backend to a list
  ansible.builtin.set_fact:
    __ai_whisper_backends: >-
      {{ ai_whisper_backend
         if (ai_whisper_backend is sequence
             and ai_whisper_backend is not string
             and ai_whisper_backend is not mapping)
         else [ai_whisper_backend] }}
  when:
    - ai_enabled | bool
    - ai_whisper_enabled | bool
  tags:
    - always

- name: Main | Validate ai_whisper_backend
  ansible.builtin.assert:
    that:
      - __ai_whisper_backends | length > 0
      - >-
        __ai_whisper_backends
        | reject('in', ['rocm', 'vulkan', 'cuda', 'cpu'])
        | list | length == 0
    fail_msg: >-
      ai_whisper_backend must be 'rocm', 'vulkan', 'cuda' or 'cpu', or a
      non-empty list of them, got '{{ ai_whisper_backend }}'
  when:
    - ai_enabled | bool
    - ai_whisper_enabled | bool
  tags:
    - always

- name: Main | Validate ai_comfyui_backend
  ansible.builtin.assert:
    that:
      - ai_comfyui_backend in ['cuda', 'rocm', 'cpu']
    fail_msg: >-
      ai_comfyui_backend must be 'cuda', 'rocm' or 'cpu',
      got '{{ ai_comfyui_backend }}'
  when:
    - ai_enabled | bool
    - ai_comfyui_enabled | bool
  tags:
    - always

- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

# The model directory the service actually uses, and the full environment of
# the drop-in: ai_ollama_environment plus the keys of the dedicated
# variables, which the validation above keeps from colliding.
- name: Main | Build Ollama service settings
  ansible.builtin.set_fact:
    __ai_ollama_models_dir: >-
      {{ ai_ollama_models_dir
         if ai_ollama_models_dir | length > 0
         else ai_ollama_environment.OLLAMA_MODELS
         | default(__ai_ollama_default_models_dir) }}
    __ai_ollama_service_environment: >-
      {{ ai_ollama_environment
         | combine({'OLLAMA_MODELS': ai_ollama_models_dir}
                   if ai_ollama_models_dir | length > 0 else {})
         | combine({'OLLAMA_HOST':
                      (ai_ollama_host | default(__ai_ollama_default_host, true))
                      ~ ':' ~ ai_ollama_port}
                   if (ai_ollama_host | length > 0
                       or ai_ollama_port | int != __ai_ollama_default_port)
                   else {}) }}
  when:
    - ai_enabled | bool
    - ai_ollama_enabled | bool
  tags:
    - always

- name: Main | Include CLI tools
  ansible.builtin.include_tasks:
    file: cli.yml
    apply:
      tags:
        - ai
        - ai:cli
  when: ai_enabled | bool
  tags:
    - ai
    - ai:cli

- name: Main | Include desktop applications
  ansible.builtin.include_tasks:
    file: desktop.yml
    apply:
      tags:
        - ai
        - ai:desktop
  when: ai_enabled | bool
  tags:
    - ai
    - ai:desktop

- name: Main | Include local AI tools
  ansible.builtin.include_tasks:
    file: local.yml
    apply:
      tags:
        - ai
        - ai:local
  when: ai_enabled | bool
  tags:
    - ai
    - ai:local

- name: Main | Include ComfyUI tasks
  ansible.builtin.include_tasks:
    file: comfyui.yml
    apply:
      tags:
        - ai
        - ai:comfyui
  when:
    - ai_enabled | bool
    - ai_comfyui_enabled | bool
  tags:
    - ai
    - ai:comfyui

- name: Main | Include user configuration
  ansible.builtin.include_tasks:
    file: users.yml
    apply:
      tags:
        - ai
        - ai:users
  when:
    - ai_enabled | bool
    - >-
      ai_claude_desktop_enabled | bool or ai_aider_enabled | bool
      or ai_opencode_enabled | bool or ai_lmstudio_enabled | bool
    - ai_users | length > 0
  tags:
    - ai
    - ai:users
