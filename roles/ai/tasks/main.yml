---
#
# AI Tools Main Tasks
#

# ai_users takes precedence; only derive when the operator left it empty.
- name: Main | Set user derivation guard
  ansible.builtin.set_fact:
    __ai_derive_users: '{{ ai_users | length == 0 }}'
  tags:
    - always

# The ai attribute marks an account as a user of the AI desktop tooling.
# Only the name is consumed here; per-user settings live in ai_users.
# Same derivation contract as the other per-user roles.
- name: Main | Derive AI users from users_list (exclude system users)
  ansible.builtin.set_fact:
    ai_users: >-
      {{ ai_users + [{'username': item.name}] }}
  loop: >-
    {{ users_list | default([]) | selectattr('ai', 'defined') | list }}
  loop_control:
    label: '{{ item.name }}'
  when:
    - ai_enabled | bool
    - __ai_derive_users | default(false) | bool
    - not (item.system | default(false) | bool)
  tags:
    - always

# Deriving ai_users from the users_list ai attribute is deprecated and will
# be removed in v4.0.0. The flag is set on every run so the warning below
# fires only while the deprecated path is in use.
- name: Main | Detect deprecated ai attribute on users_list
  ansible.builtin.set_fact:
    __ai_users_list_attribute_deprecated: >-
      {{ ai_enabled | bool
         and __ai_derive_users | default(false) | bool
         and users_list | default([]) | selectattr('ai', 'defined') | list | length > 0 }}
  tags:
    - always

- name: Main | Warn about users_list ai attribute deprecation
  ansible.builtin.debug:
    msg: >
      Deriving ai_users from the users_list ai attribute is DEPRECATED and
      will be removed in v4.0.0. Set ai_users instead. See #304.
  when: __ai_users_list_attribute_deprecated | bool
  tags:
    - always

- name: Main | Validate ai_ollama_backend
  ansible.builtin.assert:
    that:
      - ai_ollama_backend in ['rocm', 'vulkan', 'cuda', 'cpu']
    fail_msg: >-
      ai_ollama_backend must be 'rocm', 'vulkan', 'cuda' or 'cpu',
      got '{{ ai_ollama_backend }}'
  when:
    - ai_enabled | bool
    - ai_ollama_enabled | bool
  tags:
    - always

- name: Main | Validate ai_ollama_environment
  ansible.builtin.assert:
    that:
      - ai_ollama_environment is mapping
    fail_msg: >-
      ai_ollama_environment must be a mapping of environment variables,
      got '{{ ai_ollama_environment }}'
  when:
    - ai_enabled | bool
    - ai_ollama_enabled | bool
  tags:
    - always

- name: Main | Validate ai_whisper_backend
  ansible.builtin.assert:
    that:
      - ai_whisper_backend in ['rocm', 'vulkan', 'cuda', 'cpu']
    fail_msg: >-
      ai_whisper_backend must be 'rocm', 'vulkan', 'cuda' or 'cpu',
      got '{{ ai_whisper_backend }}'
  when:
    - ai_enabled | bool
    - ai_whisper_enabled | bool
  tags:
    - always

- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Include CLI tools
  ansible.builtin.include_tasks:
    file: cli.yml
    apply:
      tags:
        - ai
        - ai:cli
  when: ai_enabled | bool
  tags:
    - ai
    - ai:cli

- name: Main | Include desktop applications
  ansible.builtin.include_tasks:
    file: desktop.yml
    apply:
      tags:
        - ai
        - ai:desktop
  when: ai_enabled | bool
  tags:
    - ai
    - ai:desktop

- name: Main | Include local AI tools
  ansible.builtin.include_tasks:
    file: local.yml
    apply:
      tags:
        - ai
        - ai:local
  when: ai_enabled | bool
  tags:
    - ai
    - ai:local

- name: Main | Include ComfyUI tasks
  ansible.builtin.include_tasks:
    file: comfyui.yml
    apply:
      tags:
        - ai
        - ai:comfyui
  when:
    - ai_enabled | bool
    - ai_comfyui_enabled | bool
  tags:
    - ai
    - ai:comfyui

- name: Main | Include user configuration
  ansible.builtin.include_tasks:
    file: users.yml
    apply:
      tags:
        - ai
        - ai:users
  when:
    - ai_enabled | bool
    - ai_claude_desktop_enabled | bool
    - ai_users | length > 0
  tags:
    - ai
    - ai:users
