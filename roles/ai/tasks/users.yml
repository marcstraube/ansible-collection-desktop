---
#
# AI User Configuration
#
# Respects mode: managed | merged | initial | disabled
#   managed  — overwrite the whole file on every run
#   merged   — reconcile only the role-owned keys on every run
#   initial  — deploy only when the target config is absent, then
#              preserve it
#   disabled — skip entirely
# Per-user `mode:` overrides the tool's default
# (ai_<tool>_user_config_mode, falling back to ai_user_config_mode).

- name: Users | Include Claude Desktop entry config
  ansible.builtin.include_tasks:
    file: users_claude_desktop.yml
    apply:
      tags:
        - ai
        - ai:users
  vars:
    __ai_user_mode: '{{ ai_user.mode | default(ai_claude_desktop_user_config_mode) }}'
  tags:
    - ai
    - ai:users
  loop: '{{ ai_users }}'
  loop_control:
    loop_var: ai_user
    label: '{{ ai_user.username }}'
  when:
    - ai_claude_desktop_enabled | bool
    - (ai_user.mode | default(ai_claude_desktop_user_config_mode)) != 'disabled'

