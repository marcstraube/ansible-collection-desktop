---
#
# Role Control
#

# Enable the ai role
ai_enabled: true

#
# CLI Tools
#
# Command-line AI assistants

# Enable Claude Code (Anthropic CLI)
ai_claude_code_enabled: true

# Enable Antigravity CLI (Google — agentic development platform, CLI companion)
ai_antigravity_cli_enabled: false

# Enable OpenAI Codex CLI
ai_codex_enabled: false

# Enable OpenCode (open-source coding agent)
ai_opencode_enabled: false

# Enable auth plugin for Claude credentials
ai_opencode_claude_auth_enabled: false

# Enable auth plugin for Gemini credentials
ai_opencode_gemini_auth_enabled: false

# Enable Aider (AI pair programming)
ai_aider_enabled: false

#
# Desktop Applications
#
# GUI-based AI tools

# Enable Claude Desktop (official Anthropic app — ships Chat, Cowork and
# Claude Code in one package). Installing it removes the superseded
# claude-cowork-service backend.
ai_claude_desktop_enabled: false

# Credential backend written as --password-store= into the per-user Claude
# Desktop entry. Claude Desktop is Chromium-based and falls back to
# unencrypted storage on compositors it does not recognize, which logs the
# user out on every session switch. Pick the backend matching the host's
# keystore: 'gnome-libsecret' for the freedesktop Secret Service (KeePassXC,
# GNOME Keyring), 'kwallet6' for KWallet. Overridable per user entry via
# 'password_store'. Deployed per user via ai_users.
ai_claude_desktop_password_store: 'gnome-libsecret'  # pragma: allowlist secret

# Enable Antigravity (Google — agent-first desktop IDE, Antigravity 2.0
# multi-agent orchestration platform)
ai_antigravity_enabled: false

# Enable OpenCode Desktop (Tauri-based GUI)
ai_opencode_desktop_enabled: false

#
# Local AI / Inference
#
# Self-hosted AI inference

# Enable Ollama (local LLM server)
ai_ollama_enabled: false

# Models to pull after installation
ai_ollama_models: []
# Example:
#   ai_ollama_models:
#     - 'llama3.2'
#     - 'codellama'
#     - 'mistral'

# Enable and start the Ollama service
ai_ollama_service_enabled: true

# Enable LM Studio
ai_lmstudio_enabled: false

# Enable ComfyUI (Stable Diffusion node-based UI)
ai_comfyui_enabled: false
# GPU backend: 'nvidia', 'amd', or 'cpu' (amd is Arch-only — Debian has no
# native ROCm PyTorch package; see README)
ai_comfyui_gpu: 'nvidia'
# Git branch/tag
ai_comfyui_version: 'master'
# Installation directory
ai_comfyui_install_dir: '/opt/comfyui'
# Listen address
ai_comfyui_listen: '127.0.0.1'
# Web UI port
ai_comfyui_port: 8188
# Service user
ai_comfyui_user: 'comfyui'
# Service group
ai_comfyui_group: 'comfyui'
# Service user home (FHS state directory — kept distinct from install_dir
# so `become_user`'s ~/.ansible/tmp does not land in the git-clone target)
ai_comfyui_home: '/var/lib/comfyui'
# Enable ComfyUI-Manager
ai_comfyui_manager_enabled: true
# Enable and start the ComfyUI service
ai_comfyui_service_enabled: true

#
# User Configuration
#
# Users for whom to deploy the per-user Claude Desktop entry.
#
# Left empty, the list derives from users_list entries carrying an 'ai'
# attribute, the standard derivation across the marcstraube collections.
#
# Modes:
#   managed  — always deploy/overwrite the desktop entry
#   initial  — deploy the entry only when it is absent, then leave it
#              under the user's control (default)
#   disabled — skip config deployment for this user

ai_users: []
# ai_users:
#   - username: 'johndoe'
#     mode: 'managed'
#     password_store: 'kwallet6'

# Default mode when a user entry has no 'mode' key
# 'initial' deploys the entry only when it is absent, so hand-added
# Chromium switches survive; 'managed' reconciles continuously.
ai_user_config_mode: 'initial'
