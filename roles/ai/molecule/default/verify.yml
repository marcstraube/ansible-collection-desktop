    - name: Verify | Run role with an OpenCode model limit without output
      block:
        - name: Verify | Include ai role with only a context limit  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            ai_enabled: true
            ai_opencode_enabled: true
            ai_opencode_providers:
              ollama:
                base_url: 'http://ollama.example.com:11434/v1'
                models:
                  - id: 'qwen3-coder:30b'
                    context: 32768

        - name: Verify | Fail when the incomplete limit was accepted
          ansible.builtin.fail:
            msg: 'The role accepted an OpenCode model limit without output.'
      rescue:
        - name: Verify | Assert OpenCode limit rejection reason
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('both or none')
            quiet: true

# --check skips commands, so every read-only probe the decisions depend on
# must run anyway. A dry run against the converged state and a user without
# any files must pass without errors.
- name: Verify check mode
  hosts: all
  gather_facts: true
  check_mode: true

  tasks:
    - name: Verify | Run the user tasks in check mode  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: users.yml
      vars:
        ai_enabled: true
        ai_claude_desktop_enabled: false
        ai_aider_enabled: true
        ai_aider_model: 'ollama_chat/qwen3-coder:30b'
        ai_aider_user_config_mode: 'merged'
        ai_opencode_enabled: true
        ai_opencode_model: 'ollama/qwen3-coder:30b'
        ai_ollama_enabled: true
        __ai_ollama_models_dir: '/srv/ollama-fixture'
        ai_lmstudio_enabled: true
        ai_lmstudio_host: '0.0.0.0'
        ai_lmstudio_models:
          - repo: 'molecule/Check-GGUF'
            file: 'model.gguf'
        ai_lmstudio_ollama_models:
          - 'molecule-text'
        ai_users:
          - username: 'ai_merge_exist'
          - username: 'ai_check_none'

    - name: Verify | Run the Ollama tasks in check mode  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        ai_enabled: true
        ai_claude_code_enabled: false
        ai_antigravity_cli_enabled: false
        ai_codex_enabled: false
        ai_opencode_enabled: false
        ai_aider_enabled: false
        ai_claude_desktop_enabled: false
        ai_antigravity_enabled: false
        ai_opencode_desktop_enabled: false
        ai_ollama_enabled: true
        ai_ollama_backend: 'vulkan'
        ai_ollama_models_dir: '/srv/ollama-check'
        ai_ollama_host: '0.0.0.0'
        ai_whisper_enabled: false
        ai_lmstudio_enabled: false
        ai_comfyui_enabled: false
      when: ansible_facts['os_family'] == 'Archlinux'
