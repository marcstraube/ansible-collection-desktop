---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
      changed_when: false
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Create aur_builder user (Arch)
      ansible.builtin.user:
        name: aur_builder
        group: wheel
        create_home: true
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Configure sudoers for aur_builder (Arch)
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/aur_builder
        line: 'aur_builder ALL=(ALL) NOPASSWD: ALL'
        create: true
        mode: '0440'
        validate: 'visudo -cf %s'
      when: ansible_facts['os_family'] == 'Archlinux'

    # Claude Desktop user-config fixture.
    #
    # The role derives the per-user entry from the one the claude-desktop
    # package ships. Building that package from the AUR would drag in the
    # qemu/edk2-ovmf/virtiofsd chain for a code path that is OS-independent,
    # so the scenario exercises it where the install task is a no-op anyway:
    # on non-Arch the role only prints a notice, and this fixture stands in
    # for the packaged entry.
    - name: Prepare | Install desktop-file-utils (non-Arch)
      ansible.builtin.package:
        name: 'desktop-file-utils'
        state: present
      when: ansible_facts['os_family'] != 'Archlinux'

    - name: Prepare | Create test users (non-Arch)
      ansible.builtin.user:
        name: '{{ item }}'
        create_home: true
        shell: /bin/bash
      loop:
        # managed: reconciled on every run, own password store
        - ai_managed_user
        # initial: entry absent (deployed) and present (kept untouched)
        - ai_initial_new
        - ai_initial_exist
        # disabled: never deployed
        - ai_disabled_user
        # derived from users_list via the ai attribute
        - ai_derived_user
      loop_control:
        label: '{{ item }}'
      when: ansible_facts['os_family'] != 'Archlinux'

    - name: Prepare | Deploy packaged Claude Desktop entry fixture (non-Arch)
      ansible.builtin.copy:
        dest: '/usr/share/applications/claude-desktop.desktop'
        owner: 'root'
        group: 'root'
        mode: '0644'
        content: |
          [Desktop Entry]
          Name=Claude
          Exec=/usr/bin/claude-desktop %U
          Terminal=false
          Type=Application
          MimeType=x-scheme-handler/claude;
          Actions=new-window;

          [Desktop Action new-window]
          Name=New Window
          Exec=/usr/bin/claude-desktop --new-window
      when: ansible_facts['os_family'] != 'Archlinux'

    # Pre-seeded entry for the initial-mode keep case: the role must leave
    # this file exactly as it is, foreign switch included.
    - name: Prepare | Ensure applications directory for the keep case (non-Arch)
      ansible.builtin.file:
        path: '/home/ai_initial_exist/.local/share/applications'
        state: directory
        owner: 'ai_initial_exist'
        group: 'ai_initial_exist'
        mode: '0755'
      when: ansible_facts['os_family'] != 'Archlinux'

    - name: Prepare | Pre-seed a hand-edited entry (non-Arch)
      ansible.builtin.copy:
        dest: '/home/ai_initial_exist/.local/share/applications/claude-desktop.desktop'
        owner: 'ai_initial_exist'
        group: 'ai_initial_exist'
        mode: '0644'
        content: |
          [Desktop Entry]
          Name=Claude
          Exec=/usr/bin/claude-desktop --password-store=basic --molecule-fixture %U
          Terminal=false
          Type=Application
      when: ansible_facts['os_family'] != 'Archlinux'

    # Aider user-config fixture. The config is written independent of the
    # install, so converge runs only the user tasks on every platform.
    - name: Prepare | Create Aider test users
      ansible.builtin.user:
        name: '{{ item }}'
        create_home: true
        shell: /bin/bash
      loop:
        # managed: reconciled on every run, removed once nothing is set
        - ai_aider_managed
        # initial: config absent (deployed) and present (kept untouched)
        - ai_aider_initial_new
        - ai_aider_initial_exist
        # disabled: never deployed
        - ai_aider_disabled
      loop_control:
        label: '{{ item }}'

    - name: Prepare | Pre-seed a hand-edited Aider config
      ansible.builtin.copy:
        dest: '/home/ai_aider_initial_exist/.aider.conf.yml'
        owner: 'ai_aider_initial_exist'
        group: 'ai_aider_initial_exist'
        mode: '0600'
        content: |
          model: "molecule/fixture"

    # Claude Desktop merged fixture: a hand-edited entry with an extra key and
    # an outdated Exec line. merged must reset Exec and keep the rest.
    - name: Prepare | Create Claude Desktop merged test user (non-Arch)
      ansible.builtin.user:
        name: 'ai_merged_exist'
        create_home: true
        shell: /bin/bash
      when: ansible_facts['os_family'] != 'Archlinux'

    - name: Prepare | Ensure applications directory for the merged case (non-Arch)
      ansible.builtin.file:
        path: '/home/ai_merged_exist/.local/share/applications'
        state: directory
        owner: 'ai_merged_exist'
        group: 'ai_merged_exist'
        mode: '0755'
      when: ansible_facts['os_family'] != 'Archlinux'

    - name: Prepare | Pre-seed a hand-edited entry for merged mode (non-Arch)
      ansible.builtin.copy:
        dest: '/home/ai_merged_exist/.local/share/applications/claude-desktop.desktop'
        owner: 'ai_merged_exist'
        group: 'ai_merged_exist'
        mode: '0644'
        content: |
          [Desktop Entry]
          Name=Claude
          Exec=/usr/bin/claude-desktop --outdated %U
          X-Molecule-Fixture=kept
          Terminal=false
          Type=Application

          [Desktop Action new-window]
          Name=New Window
          Exec=/usr/bin/claude-desktop --outdated
      when: ansible_facts['os_family'] != 'Archlinux'

    # Merged-mode fixtures for Aider, OpenCode and LM Studio: every file
    # carries a key of the user's own that must survive.
    - name: Prepare | Create merged-mode test users
      ansible.builtin.user:
        name: '{{ item }}'
        create_home: true
        shell: /bin/bash
      loop:
        # merged with an existing file (user keys kept)
        - ai_merge_exist
        # merged without a file (created with the role-owned keys)
        - ai_merge_new
        # OpenCode managed (whole file) and initial (kept)
        - ai_merge_managed
        - ai_merge_initial
        # an opencode.jsonc of the user's own, which the role must not replace
        - ai_merge_foreign
        # no files at all, for the check-mode run in verify.yml
        - ai_check_none
      loop_control:
        label: '{{ item }}'

    - name: Prepare | Create config directories for the merged fixtures
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: "{{ item.split('/')[2] }}"
        group: "{{ item.split('/')[2] }}"
        mode: '0755'
      loop:
        - '/home/ai_merge_exist/.config'
        - '/home/ai_merge_exist/.config/opencode'
        - '/home/ai_merge_exist/.lmstudio'
        - '/home/ai_merge_exist/.lmstudio/.internal'
        - '/home/ai_merge_initial/.config'
        - '/home/ai_merge_initial/.config/opencode'
        - '/home/ai_merge_foreign/.config'
        - '/home/ai_merge_foreign/.config/opencode'
        - '/home/ai_merge_exist/.lmstudio/models'
        - '/home/ai_merge_exist/.lmstudio/models/molecule'

    - name: Prepare | Pre-seed merged-mode config files
      ansible.builtin.copy:
        dest: '{{ item.path }}'
        owner: "{{ item.path.split('/')[2] }}"
        group: "{{ item.path.split('/')[2] }}"
        mode: '0644'
        content: '{{ item.content }}'
      loop:
        - path: '/home/ai_merge_exist/.aider.conf.yml'
          content: |
            # hand-written comment, dropped on the first write
            model: "molecule/outdated"
            dark-mode: true
        - path: '/home/ai_merge_exist/.config/opencode/opencode.json'
          content: |
            {
              "$schema": "https://opencode.ai/config.json",
              "theme": "molecule",
              "provider": {"outdated": {"npm": "x", "options": {}, "models": {}}}
            }
        - path: '/home/ai_merge_initial/.config/opencode/opencode.jsonc'
          content: |
            {"theme": "initial-fixture"}
        - path: '/home/ai_merge_foreign/.config/opencode/opencode.jsonc'
          content: |
            // the user's own file
            {"theme": "foreign-fixture"}
        - path: '/home/ai_merge_exist/.lmstudio/settings.json'
          content: |
            {"downloadsFolder": "/old/models", "appTheme": "molecule"}
        - path: '/home/ai_merge_exist/.lmstudio/.internal/http-server-config.json'
          content: |
            {"port": 1234, "networkInterface": "127.0.0.1", "cors": true}
      loop_control:
        label: '{{ item.path }}'

    # A model repository moved to another disk and linked back by hand: the
    # role must keep the link and download through it.
    - name: Prepare | Create a model repository on another disk
      ansible.builtin.file:
        path: '/srv/hdd-models/Repo-GGUF'
        state: directory
        mode: '0755'

    - name: Prepare | Link the moved model repository into LM Studio
      ansible.builtin.file:
        src: '/srv/hdd-models/Repo-GGUF'
        dest: '/home/ai_merge_exist/.lmstudio/models/molecule/Repo-GGUF'
        state: link
        owner: 'ai_merge_exist'
        group: 'ai_merge_exist'
        follow: false

    # Stand-in for downloads with the Hugging Face CLI, so the test needs no
    # network: it takes 'download <repo> <file> --local-dir <dir>' like the
    # real one and hands every other command to the packaged CLI (Arch).
    - name: Prepare | Install a stand-in Hugging Face CLI
      ansible.builtin.copy:
        dest: '/usr/local/bin/hf'
        mode: '0755'
        content: |
          #!/bin/sh
          if [ "$1" = download ] && [ "$4" = --local-dir ]; then
            mkdir -p "$5" && echo "$2/$3" > "$5/$3"
            exit
          fi
          exec /usr/bin/hf "$@"

    # A fake Ollama store with one vision model (model + projector layer) and
    # one text model; the blobs are placeholders, only the links are tested.
    - name: Prepare | Create Ollama store fixture directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop:
        - '/srv/ollama-fixture/blobs'
        - '/srv/ollama-fixture/manifests/registry.ollama.ai/library/molecule-text'
        - '/srv/ollama-fixture/manifests/hf.co/molecule/Vision-Model-GGUF'

    - name: Prepare | Create Ollama store fixture files
      ansible.builtin.copy:
        dest: '{{ item.path }}'
        mode: '0644'
        content: '{{ item.content }}'
      loop:
        - path: '/srv/ollama-fixture/blobs/sha256-aaaa'
          content: 'text model'
        - path: '/srv/ollama-fixture/blobs/sha256-bbbb'
          content: 'vision model'
        - path: '/srv/ollama-fixture/blobs/sha256-cccc'
          content: 'projector'
        - path: '/srv/ollama-fixture/manifests/registry.ollama.ai/library/molecule-text/latest'
          content: >-
            {"layers": [{"mediaType": "application/vnd.ollama.image.model",
            "digest": "sha256:aaaa"}]}
        - path: '/srv/ollama-fixture/manifests/hf.co/molecule/Vision-Model-GGUF/Q4_K_M'
          content: >-
            {"layers": [{"mediaType": "application/vnd.ollama.image.model",
            "digest": "sha256:bbbb"}, {"mediaType": "application/vnd.ollama.image.projector",
            "digest": "sha256:cccc"}, {"mediaType": "application/vnd.ollama.image.template",
            "digest": "sha256:dddd"}]}
      loop_control:
        label: '{{ item.path }}'

    # A link directory of a model that is no longer listed: the role removes it
    - name: Prepare | Create a stale Ollama link directory
      ansible.builtin.file:
        path: '/home/ai_merge_exist/.lmstudio/models/ollama/dropped-latest'
        state: directory
        owner: 'ai_merge_exist'
        group: 'ai_merge_exist'
        mode: '0755'
