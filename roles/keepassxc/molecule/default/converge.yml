---
- name: Converge | Managed mode
  hosts: all
  gather_facts: true

  vars:
    keepassxc_enabled: true
    keepassxc_secret_service_enabled: true
    keepassxc_secret_service_scope: 'global'  # pragma: allowlist secret
    keepassxc_autostart_enabled: true
    keepassxc_user_config_mode: 'managed'
    keepassxc_users:
      - name: 'testuser'
        mode: 'managed'
      - name: 'kp_disabled_user'
        mode: 'disabled'

  tasks:
    - name: Converge | Include keepassxc role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'


# initial mode is gated on keepassxc.ini existence (not __users_newly_created):
# deploy only when the file is absent, leaving an existing config untouched.
# autostart / secret_service are independent per-user opt-outs and are
# disabled here so the play exercises the config-mode path in isolation.
- name: Converge | Initial mode (existing-file gating)
  hosts: all
  gather_facts: false

  vars:
    keepassxc_enabled: true
    keepassxc_secret_service_enabled: false
    keepassxc_autostart_enabled: false
    keepassxc_user_config_mode: 'initial'
    keepassxc_users:
      - name: 'kp_initial_fresh'
      - name: 'kp_initial_exist'

  pre_tasks:
    - name: Converge | Ensure existing-user config dir exists
      ansible.builtin.file:
        path: /home/kp_initial_exist/.config/keepassxc
        state: directory
        owner: kp_initial_exist
        group: kp_initial_exist
        mode: '0700'

    - name: Converge | Pre-seed existing keepassxc.ini to prove it is left untouched
      ansible.builtin.copy:
        content: |
          [General]
          ConfigVersion=99

          [MoleculeFixture]
          preexisting=true
        dest: /home/kp_initial_exist/.config/keepassxc/keepassxc.ini
        owner: kp_initial_exist
        group: kp_initial_exist
        mode: '0600'

  tasks:
    - name: Converge | Include keepassxc role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'


- name: Converge | Disabled mode (global)
  hosts: all
  gather_facts: false

  vars:
    keepassxc_enabled: true
    keepassxc_secret_service_enabled: false
    keepassxc_autostart_enabled: false
    keepassxc_user_config_mode: 'disabled'
    keepassxc_users:
      - name: 'kp_global_disabled'

    # A configured keepassxc_users wins over users_list, lang included.
    users_list:
      - name: 'kp_global_disabled'
        lang: 'de_DE.UTF-8'

  tasks:
    - name: Converge | Include keepassxc role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    - name: Converge | Assert no users_list lang deprecation warning
      ansible.builtin.assert:
        that:
          - not (__keepassxc_users_list_lang_deprecated | bool)
        fail_msg: 'deprecation warning fired although keepassxc_users is set'
        quiet: true


# Users derived from users_list. The derived entry carries the deprecated
# lang attribute; the global disabled mode keeps the derived users from
# touching any home directory.
- name: Converge | Users derived from users_list
  hosts: all
  gather_facts: false

  vars:
    keepassxc_enabled: true
    keepassxc_secret_service_enabled: false
    keepassxc_autostart_enabled: false
    keepassxc_user_config_mode: 'disabled'
    users_list:
      - name: 'root'
      - name: 'kp_global_disabled'
        lang: 'de_DE.UTF-8'
      - name: 'kp_system_account'
        system: true

  tasks:
    - name: Converge | Include keepassxc role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    - name: Converge | Assert users_list lang deprecation warning and derivation
      ansible.builtin.assert:
        that:
          - __keepassxc_users_list_lang_deprecated | bool
          - keepassxc_users | map(attribute='name') | list == ['kp_global_disabled']
        fail_msg: 'users_list derivation or its lang deprecation warning is wrong'
        quiet: true
