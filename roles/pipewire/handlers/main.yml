---
#
# PipeWire Handlers
#

# Defined before 'Restart PipeWire': handlers run in definition order, so
# WirePlumber sees the new ACP_PROFILE_SET when it enumerates the cards again.
# udevadm may not be available in containers
- name: Reload PipeWire udev rules
  ansible.builtin.command:
    cmd: 'udevadm control --reload-rules'
  changed_when: false
  failed_when: false
  listen: PipeWire reload udev
  when: pipewire_enabled | bool

# udevadm may not be available in containers
- name: Trigger PipeWire sound udev events
  ansible.builtin.command:
    cmd: 'udevadm trigger --action=change --subsystem-match=sound'
  changed_when: false
  failed_when: false
  listen: PipeWire reload udev
  when: pipewire_enabled | bool

- name: Restart PipeWire
  ansible.builtin.systemd_service:
    name: '{{ item.1 }}'
    state: restarted
    scope: user
  become: true
  become_user: '{{ item.0.name }}'
  loop: "{{ pipewire_users | default([]) | product(__pipewire_user_services | default([])) | list }}"
  loop_control:
    label: '{{ item.0.name }}: {{ item.1 }}'
  when: pipewire_service_enabled | bool
  # Systemd user scope not available in containers (molecule)
  failed_when: false
