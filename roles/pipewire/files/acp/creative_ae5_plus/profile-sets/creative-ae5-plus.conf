; Creative Sound BlasterX AE-5 Plus (CA0132) profile set of the
; marcstraube.desktop.pipewire role. udev selects it for this card only
; (ACP_PROFILE_SET). It loads the packaged default profile set and replaces
; the analog output paths with the quirk paths; all other mappings and
; settings stay as packaged.

.include /usr/share/alsa-card-profile/mixer/profile-sets/default.conf

[Mapping analog-stereo]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker creative-ae5-plus-analog-output-headphones analog-output-headphones-2

[Mapping stereo-fallback]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker creative-ae5-plus-analog-output-headphones analog-output-headphones-2

[Mapping mono-fallback]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker creative-ae5-plus-analog-output-headphones analog-output-headphones-2 analog-output-mono

[Mapping analog-surround-21]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker

[Mapping analog-surround-40]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker

[Mapping analog-surround-41]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker

[Mapping analog-surround-50]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker

[Mapping analog-surround-51]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker

[Mapping analog-surround-71]
paths-output = creative-ae5-plus-analog-output creative-ae5-plus-analog-output-lineout analog-output-speaker
