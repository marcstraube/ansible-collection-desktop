---
# All three plays share an identical feature-toggle set so the per-play
# manage tasks stay idempotent across the sequence (the database tool tasks
# remove packages when their toggle flips to false, which would otherwise
# make play 1 reinstall on every converge). Only development_user_config_mode
# and development_users differ between the plays.
#
# The devkitPro dkp-libs / dkp-linux repositories the toolchain toggles
# depend on are registered in prepare.yml (via the real
# marcstraube.common.package_management pacman tasks), so package_management's
# own idempotence is not coupled to this scenario's idempotence gate.
# devkitPro coverage is disabled in CI via __molecule_devkitpro_reachable
# (molecule.yml) — pkg.devkitpro.org blocks GitHub-hosted runners.
- name: Converge | Managed mode
  hosts: all
  gather_facts: true

  vars:
    development_enabled: true
    development_gb_gbdk_enabled: true
    development_gb_gbstudio_enabled: true
    development_devkitpro_enabled: '{{ __molecule_devkitpro_reachable | default(true) | bool }}'
    development_devkitpro_gba_dev_enabled: true
    development_vscodium_enabled: false
    development_vscode_enabled: false
    development_zed_enabled: false
    development_arduino_ide_enabled: false
    development_arduino_classic_enabled: false
    development_lua_stylua_enabled: true
    development_lua_luacheck_enabled: true
    development_lua_busted_enabled: true
    development_qml_tools_enabled: true
    development_dbeaver_enabled: false
    development_pgadmin_enabled: false
    development_user_config_mode: 'managed'
    development_users:
      - username: 'dev_managed_user'
        git_name: 'Dev Managed'
        git_email: 'managed@example.com'
      - username: 'dev_disabled_user'
        mode: 'disabled'
        git_name: 'Dev Disabled'
        git_email: 'disabled@example.com'

  tasks:
    - name: Converge | Include development role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'


# initial mode deploys only when the target config is absent, and
# preserves it afterwards.
- name: Converge | Initial mode (per-user gating)
  hosts: all
  gather_facts: false

  vars:
    development_enabled: true
    development_gb_gbdk_enabled: true
    development_gb_gbstudio_enabled: true
    development_devkitpro_enabled: '{{ __molecule_devkitpro_reachable | default(true) | bool }}'
    development_devkitpro_gba_dev_enabled: true
    development_vscodium_enabled: false
    development_vscode_enabled: false
    development_zed_enabled: false
    development_arduino_ide_enabled: false
    development_arduino_classic_enabled: false
    development_lua_stylua_enabled: true
    development_lua_luacheck_enabled: true
    development_lua_busted_enabled: true
    development_qml_tools_enabled: true
    development_dbeaver_enabled: false
    development_pgadmin_enabled: false
    development_user_config_mode: 'initial'
    development_users:
      - username: 'dev_initial_new'
        git_name: 'Dev Initial New'
        git_email: 'new@example.com'
      - username: 'dev_initial_exist'
        git_name: 'Dev Initial Exist'
        git_email: 'exist@example.com'

  tasks:
    - name: Converge | Include development role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'


- name: Converge | Disabled mode (global)
  hosts: all
  gather_facts: false

  vars:
    development_enabled: true
    development_gb_gbdk_enabled: true
    development_gb_gbstudio_enabled: true
    development_devkitpro_enabled: '{{ __molecule_devkitpro_reachable | default(true) | bool }}'
    development_devkitpro_gba_dev_enabled: true
    development_vscodium_enabled: false
    development_vscode_enabled: false
    development_zed_enabled: false
    development_arduino_ide_enabled: false
    development_arduino_classic_enabled: false
    development_lua_stylua_enabled: true
    development_lua_luacheck_enabled: true
    development_lua_busted_enabled: true
    development_qml_tools_enabled: true
    development_dbeaver_enabled: false
    development_pgadmin_enabled: false
    development_user_config_mode: 'disabled'
    development_users:
      - username: 'dev_global_disabled'
        git_name: 'Dev Global Disabled'
        git_email: 'gd@example.com'

  tasks:
    - name: Converge | Include development role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
