# Users derived from the deprecated users_list git attribute. The global
# disabled mode keeps the derived users from touching any home directory.
- name: Converge | Users derived from users_list (deprecated)
  hosts: all
  gather_facts: false

  vars:
    development_enabled: true
    development_gb_gbdk_enabled: true
    development_gb_gbstudio_enabled: true
    development_devkitpro_enabled: '{{ __molecule_devkitpro_reachable | default(true) | bool }}'
    development_devkitpro_gba_dev_enabled: true
    development_godot_enabled: true
    development_godot_mono_enabled: true
    development_unreal_engine_enabled: true
    development_vscodium_enabled: false
    development_vscode_enabled: false
    development_zed_enabled: false
    development_arduino_ide_enabled: false
    development_arduino_classic_enabled: false
    development_lua_stylua_enabled: true
    development_lua_luacheck_enabled: true
    development_lua_busted_enabled: true
    development_qml_tools_enabled: true
    development_dbeaver_enabled: false
    development_pgadmin_enabled: false
    development_user_config_mode: 'disabled'
    users_list:
      - name: 'dev_derived_user'
        git:
          name: 'Dev Derived'
      - name: 'dev_plain_user'
      - name: 'dev_system_account'
        system: true
        git:
          name: 'Dev System'

  tasks:
    - name: Converge | Include development role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    - name: Converge | Assert users_list deprecation warning and derivation
      ansible.builtin.assert:
        that:
          - __development_users_list_attribute_deprecated | bool
          - development_users | map(attribute='username') | list == ['dev_derived_user']
        fail_msg: 'users_list git attribute derivation or its deprecation warning is wrong'
        quiet: true
