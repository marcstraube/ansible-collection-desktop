---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    - name: Verify | Load OS-specific variables
      ansible.builtin.include_vars: '{{ item }}'
      with_first_found:
        - files:
            - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["distribution"] }}.yml'
            - '{{ ansible_facts["os_family"] }}.yml'
          paths:
            - '../../vars'

    #
    # Language Tooling (Lua, QML — skipped when the platform has no package)
    #

    - name: Verify | stylua — package installed
      ansible.builtin.package:
        name: '{{ __development_lua_stylua_package }}'
        state: present
      check_mode: true
      register: _dev_stylua_check
      failed_when: _dev_stylua_check.changed
      when: __development_lua_stylua_package | default('') | length > 0

    - name: Verify | luacheck — package installed
      ansible.builtin.package:
        name: '{{ __development_lua_luacheck_package }}'
        state: present
      check_mode: true
      register: _dev_luacheck_check
      failed_when: _dev_luacheck_check.changed
      when: __development_lua_luacheck_package | default('') | length > 0

    - name: Verify | busted — package installed
      ansible.builtin.package:
        name: '{{ __development_lua_busted_package }}'
        state: present
      check_mode: true
      register: _dev_busted_check
      failed_when: _dev_busted_check.changed
      when: __development_lua_busted_package | default('') | length > 0

    - name: Verify | qml-tools — package installed
      ansible.builtin.package:
        name: '{{ __development_qml_tools_package }}'
        state: present
      check_mode: true
      register: _dev_qml_tools_check
      failed_when: _dev_qml_tools_check.changed
      when: __development_qml_tools_package | default('') | length > 0

    #
    # Game Engines — Godot toggles on (Arch only: Debian must not get the
    # distribution's Godot 3.6, EL has no package); Unreal Engine enabled
    # without a vendor file, so the package is never installed and only the
    # AUR clone of the helper proves it ran up to the notice.
    #

    - name: Verify | Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify | Assert godot and godot-mono are installed (Arch)
      ansible.builtin.assert:
        that:
          - "'godot' in ansible_facts['packages']"
          - "'godot-mono' in ansible_facts['packages']"
        fail_msg: 'godot and godot-mono are not both installed'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Assert the Godot toggles are a no-op (non-Arch)
      ansible.builtin.assert:
        that:
          - "'godot' not in ansible_facts['packages']"
          - "'godot-mono' not in ansible_facts['packages']"
        fail_msg: 'the Godot toggles installed a package on {{ ansible_facts["os_family"] }}'
      when: ansible_facts['os_family'] != 'Archlinux'

    - name: Verify | Assert unreal-engine-bin is not installed
      ansible.builtin.assert:
        that:
          - "'unreal-engine-bin' not in ansible_facts['packages']"
        fail_msg: 'unreal-engine-bin is installed although no vendor file exists'

    - name: Verify | Stat the unreal-engine-bin AUR clone of the helper (Arch)
      ansible.builtin.stat:
        path: /var/cache/aur_builder/vendor_packages/unreal-engine-bin/PKGBUILD
      register: _dev_unreal_clone
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Find staged vendor files (Arch)
      ansible.builtin.find:
        paths: /var/cache/aur_builder/vendor_packages/sources
      register: _dev_unreal_staged
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Assert the helper cloned unreal-engine-bin and staged nothing (Arch)
      ansible.builtin.assert:
        that:
          - _dev_unreal_clone.stat.exists
          - _dev_unreal_staged.matched == 0
        fail_msg: 'vendor_packages did not clone unreal-engine-bin, or a vendor file was staged'
      when: ansible_facts['os_family'] == 'Archlinux'

    #
    # devkitPro (Arch only — master + gba-dev enabled, switch-dev absent).
    # No-op on non-Arch, so nothing to verify there. Skipped in CI —
    # pkg.devkitpro.org blocks GitHub-hosted runners, so converge runs
    # with the devkitPro master toggle disabled there (see
    # __molecule_devkitpro_reachable in molecule.yml).
    #

    - name: Verify | devkitpro-keyring installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q devkitpro-keyring'
      register: _dev_dkp_keyring
      changed_when: false
      failed_when: _dev_dkp_keyring.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __molecule_devkitpro_reachable | default(true) | bool

    - name: Verify | devkit-env installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q devkit-env'
      register: _dev_dkp_env
      changed_when: false
      failed_when: _dev_dkp_env.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __molecule_devkitpro_reachable | default(true) | bool

    - name: Verify | Stat devkit-env profile script (Arch)
      ansible.builtin.stat:
        path: /etc/profile.d/devkit-env.sh
      register: _dev_dkp_profile
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __molecule_devkitpro_reachable | default(true) | bool

    - name: Verify | Assert devkit-env profile script exists (Arch)
      ansible.builtin.assert:
        that:
          - _dev_dkp_profile.stat.exists
        fail_msg: '/etc/profile.d/devkit-env.sh not shipped by devkit-env'
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __molecule_devkitpro_reachable | default(true) | bool

    - name: Verify | devkitARM compiler runs (Arch)
      ansible.builtin.command:
        cmd: '/opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version'
      register: _dev_dkp_gcc
      changed_when: false
      failed_when: _dev_dkp_gcc.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __molecule_devkitpro_reachable | default(true) | bool

    - name: Verify | switch-dev toolchain absent (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q devkitA64'
      register: _dev_dkp_switch
      changed_when: false
      failed_when: _dev_dkp_switch.rc == 0
      when: ansible_facts['os_family'] == 'Archlinux'
