---
#
# Database Tools Installation
#

- name: Tools | Install DBeaver
  ansible.builtin.package:
    name: '{{ __development_dbeaver_package }}'
    state: present
  when:
    - __development_dbeaver_package | default('') | length > 0
    - development_dbeaver_enabled | bool
  retries: 3
  delay: 5

- name: Tools | Install pgAdmin
  ansible.builtin.package:
    name: '{{ __development_pgadmin_package }}'
    state: present
  when:
    - __development_pgadmin_package | default('') | length > 0
    - development_pgadmin_enabled | bool
  retries: 3
  delay: 5
