---
#
# Lua Tooling Installation
#

- name: Lua | Install stylua
  ansible.builtin.package:
    name: '{{ __development_lua_stylua_package }}'
    state: present
  when:
    - __development_lua_stylua_package | default('') | length > 0
    - development_lua_stylua_enabled | bool
  retries: 3
  delay: 5

- name: Lua | Install luacheck
  ansible.builtin.package:
    name: '{{ __development_lua_luacheck_package }}'
    state: present
  when:
    - __development_lua_luacheck_package | default('') | length > 0
    - development_lua_luacheck_enabled | bool
  retries: 3
  delay: 5

- name: Lua | Install busted
  ansible.builtin.package:
    name: '{{ __development_lua_busted_package }}'
    state: present
  when:
    - __development_lua_busted_package | default('') | length > 0
    - development_lua_busted_enabled | bool
  retries: 3
  delay: 5
