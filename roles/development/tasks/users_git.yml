---
#
# Git User Configuration
#
# Mode semantics:
#   managed  — reconcile the git config on every run
#   initial  — write only when the user has no git config yet
#   disabled — never write (gated in users.yml)

- name: Users Git | Get user info
  ansible.builtin.getent:
    database: passwd
    key: '{{ dev_user.username }}'

- name: Users Git | Set user home fact
  ansible.builtin.set_fact:
    __development_git_user_home: "{{ ansible_facts['getent_passwd'][dev_user.username][4] }}"

# git-config(1): --global writes to ~/.gitconfig, but falls back to
# $XDG_CONFIG_HOME/git/config when that file exists and ~/.gitconfig
# does not. Both locations therefore count as an existing config.
- name: Users Git | Stat existing gitconfig locations
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - '{{ __development_git_user_home }}/.gitconfig'
    - '{{ __development_git_user_home }}/.config/git/config'
  loop_control:
    label: '{{ item }}'
  register: __development_git_config_stats

- name: Users Git | Build deploy decision
  ansible.builtin.set_fact:
    __development_git_should_deploy: >-
      {{ (dev_user.mode | default(development_user_config_mode)) == 'managed'
         or not (__development_git_config_stats.results
                 | map(attribute='stat.exists') | select | list | length > 0) }}

- name: Users Git | Configure user name
  community.general.git_config:
    name: user.name
    value: '{{ dev_user.git_name }}'
    scope: global
  become: true
  become_user: '{{ dev_user.username }}'
  when:
    - __development_git_should_deploy | bool
    - dev_user.git_name is defined

- name: Users Git | Configure user email
  community.general.git_config:
    name: user.email
    value: '{{ dev_user.git_email }}'
    scope: global
  become: true
  become_user: '{{ dev_user.username }}'
  when:
    - __development_git_should_deploy | bool
    - dev_user.git_email is defined

- name: Users Git | Configure signing key
  community.general.git_config:
    name: user.signingkey
    value: '{{ dev_user.git_signing_key }}'
    scope: global
  become: true
  become_user: '{{ dev_user.username }}'
  when:
    - __development_git_should_deploy | bool
    - dev_user.git_signing_key is defined

- name: Users Git | Enable commit signing
  community.general.git_config:
    name: commit.gpgsign
    value: 'true'
    scope: global
  become: true
  become_user: '{{ dev_user.username }}'
  when:
    - __development_git_should_deploy | bool
    - dev_user.git_signing_key is defined

- name: Users Git | Apply global git config
  community.general.git_config:
    name: '{{ item.key }}'
    value: '{{ item.value }}'
    scope: global
  loop: '{{ development_git_config | dict2items }}'
  become: true
  become_user: '{{ dev_user.username }}'
  when: __development_git_should_deploy | bool
