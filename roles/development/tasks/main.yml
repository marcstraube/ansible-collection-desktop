---
#
# Development Main Tasks
#

# The git attribute marks an account as a developer workstation user.
# Its values are consumed by marcstraube.common.git, not here — this role
# only needs the names to write per-user editor configuration.
- name: Main | Derive development users from users_list (exclude system users)
  ansible.builtin.set_fact:
    development_users: >-
      {{ (users_list | default([])
          | selectattr('git', 'defined')
          | selectattr('system', 'undefined') | list
          + users_list | default([])
          | selectattr('git', 'defined')
          | selectattr('system', 'defined')
          | rejectattr('system', 'equalto', true) | list)
         | community.general.json_query('[].{username: name}') }}
  when:
    - development_enabled | bool
    - development_users | length == 0
    - users_list is defined
    - users_list | length > 0
  tags:
    - always

- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Import IDEs tasks
  ansible.builtin.import_tasks: ides.yml
  when: development_enabled | bool
  tags:
    - development
    - development:ides

- name: Main | Import Gameboy development tasks
  ansible.builtin.import_tasks: gb_dev.yml
  when: development_enabled | bool
  tags:
    - development
    - development:gb-dev

- name: Main | Import devkitPro toolchain tasks
  ansible.builtin.import_tasks: devkitpro.yml
  when:
    - development_enabled | bool
    - development_devkitpro_enabled | bool
  tags:
    - development
    - development:devkitpro

- name: Main | Import database tools tasks
  ansible.builtin.import_tasks: tools.yml
  when: development_enabled | bool
  tags:
    - development
    - development:tools

- name: Main | Import Lua tooling tasks
  ansible.builtin.import_tasks: lua.yml
  when: development_enabled | bool
  tags:
    - development
    - development:lua

- name: Main | Import QML tooling tasks
  ansible.builtin.import_tasks: qml.yml
  when: development_enabled | bool
  tags:
    - development
    - development:qml

- name: Main | Import user configuration tasks
  ansible.builtin.import_tasks: users.yml
  when:
    - development_enabled | bool
    - development_users | length > 0
  tags:
    - development
    - development:users
