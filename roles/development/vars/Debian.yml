---
#
# Debian Variables
#

# Arduino: IDE 2.x is Flatpak/AppImage only (no-op via ides.yml notice);
# the classic 1.x IDE is packaged officially
__development_arduino_classic_package: 'arduino'

# Serial device access for Arduino
__development_serial_groups:
  - 'dialout'

# Database tools
__development_dbeaver_package: ''
__development_pgadmin_package: ''

# Lua tooling (stylua not packaged in Debian)
__development_lua_stylua_package: ''
__development_lua_luacheck_package: 'lua-check'
__development_lua_busted_package: 'lua-busted'

# QML tooling (qmllint + qmlformat ship in the same package)
__development_qml_tools_package: 'qt6-declarative-dev-tools'

# Game engines: Debian Trixie ships Godot 3.6 as `godot`, a different major
# version than the Godot 4 packages on Arch, and no Mono build — both no-op
__development_godot_package: ''
__development_godot_mono_package: ''
