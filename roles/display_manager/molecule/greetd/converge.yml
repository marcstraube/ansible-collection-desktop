---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    display_manager_enabled: true
    display_manager_name: 'greetd'
    display_manager_service_enabled: false
    display_manager_autologin_enabled: false
    # regreet is not packaged for Debian
    display_manager_greetd_greeter: >-
      {{ 'gtkgreet' if ansible_facts['os_family'] == 'Debian' else 'regreet' }}
    display_manager_greetd_greeter_compositor: 'hyprland'
    display_manager_greetd_keyboard_layout: 'de'
    display_manager_greetd_keyboard_variant: 'nodeadkeys'

  tasks:
    - name: Converge | Include display_manager role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
