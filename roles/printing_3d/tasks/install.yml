---
#
# FDM Slicers
#

- name: Install | OrcaSlicer from AUR (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __printing_3d_aur_packages.orcaslicer }}'
    state: present
  when:
    - printing_3d_orcaslicer_enabled | bool
    - (__printing_3d_aur_packages | default({}))['orcaslicer'] | default([]) | length > 0
  retries: 3
  delay: 5

- name: Install | PrusaSlicer
  ansible.builtin.package:
    name: '{{ __printing_3d_prusaslicer_package }}'
    state: present
  when:
    - printing_3d_prusaslicer_enabled | bool
    - __printing_3d_prusaslicer_package | default('') | length > 0
  retries: 3
  delay: 5

- name: Install | UltiMaker Cura
  ansible.builtin.package:
    name: '{{ __printing_3d_cura_package }}'
    state: present
  when:
    - printing_3d_cura_enabled | bool
    - __printing_3d_cura_package | default('') | length > 0
  retries: 3
  delay: 5

- name: Install | UltiMaker Cura from AUR (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __printing_3d_aur_packages.cura }}'
    state: present
  when:
    - printing_3d_cura_enabled | bool
    - (__printing_3d_aur_packages | default({}))['cura'] | default([]) | length > 0
  retries: 3
  delay: 5

