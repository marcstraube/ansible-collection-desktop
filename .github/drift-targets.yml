---
# Drift-detection targets — packages currently marked as Layer-1 no-ops
# (empty `__<role>_<pkg>_package` in vars/{distro}.yml). The
# drift-detection workflow periodically probes each entry and opens an
# issue when the package becomes installable again, so the
# corresponding vars file entry can be restored.
#
# Schema (per entry):
#   role:       role directory under roles/
#   platform:   one of archlinux | debian-trixie | rocky-9 | rocky-10
#   package:    upstream package name to probe with the platform's PM
#   source:     'repo' (default) or 'aur' — aur targets attempt a
#               makepkg build instead of a pacman download
#   vars_file:  path (relative to the role) to the vars file that
#               currently holds the no-op; included in the drift issue
#               so the fix location is obvious
#
# Add an entry here when introducing a new Layer-1 no-op; remove the
# entry when restoring the package.

targets:
  # EL10 EPEL drift — Qt 6.10 / unpackaged set landed via #129/#131.
  - role: communication
    platform: rocky-10
    package: kmail
    vars_file: vars/RedHat.yml

  - role: system_apps
    platform: rocky-10
    package: gparted
    vars_file: vars/RedHat.yml

  - role: system_apps
    platform: rocky-10
    package: solaar
    vars_file: vars/RedHat.yml

  - role: system_apps
    platform: rocky-10
    package: timeshift
    vars_file: vars/RedHat.yml

  - role: system_apps
    platform: rocky-10
    package: deja-dup
    vars_file: vars/RedHat.yml

  # EL9 EPEL drift — wine-core depends on mesa-libOSMesa, dropped from
  # EL9 (#163).
  - role: wine
    platform: rocky-9
    package: wine
    vars_file: vars/RedHat-9.yml

  # EL10 EPEL drift — file managers not packaged in EPEL 10 (#306).
  - role: filemanagers
    platform: rocky-10
    package: Thunar
    vars_file: vars/RedHat.yml

  - role: filemanagers
    platform: rocky-10
    package: nemo
    vars_file: vars/RedHat.yml

  # EL10 drift — desktop environments not packaged in EL 10 / EPEL 10;
  # the main package stands in for the extras of its stack (#307).
  - role: desktop_environment
    platform: rocky-10
    package: hyprland
    vars_file: vars/RedHat.yml

  - role: desktop_environment
    platform: rocky-10
    package: sway
    vars_file: vars/RedHat.yml

  - role: desktop_environment
    platform: rocky-10
    package: i3
    vars_file: vars/RedHat.yml

  - role: desktop_environment
    platform: rocky-10
    package: lxde-common
    vars_file: vars/RedHat.yml

  - role: desktop_environment
    platform: rocky-10
    package: '@lxqt-desktop-environment'
    vars_file: vars/RedHat.yml

  # EL10 drift — LibreOffice is not packaged in EL 10 (#307).
  - role: office
    platform: rocky-10
    package: libreoffice
    vars_file: vars/RedHat.yml

  # EL9 drift — desktop environments and i3 extras not packaged in
  # EL 9 / EPEL 9; the main package stands in for the extras of its
  # stack (#307).
  - role: desktop_environment
    platform: rocky-9
    package: hyprland
    vars_file: vars/RedHat-9.yml

  - role: desktop_environment
    platform: rocky-9
    package: sway
    vars_file: vars/RedHat-9.yml

  - role: desktop_environment
    platform: rocky-9
    package: lxde-common
    vars_file: vars/RedHat-9.yml

  - role: desktop_environment
    platform: rocky-9
    package: '@lxqt-desktop-environment'
    vars_file: vars/RedHat-9.yml

  - role: desktop_environment
    platform: rocky-9
    package: i3blocks
    vars_file: vars/RedHat-9.yml

  - role: desktop_environment
    platform: rocky-9
    package: polybar
    vars_file: vars/RedHat-9.yml

  - role: desktop_environment
    platform: rocky-9
    package: picom
    vars_file: vars/RedHat-9.yml

  # EL9 drift — office applications not packaged in EPEL 9 (#307).
  - role: office
    platform: rocky-9
    package: mupdf
    vars_file: vars/RedHat-9.yml

  - role: office
    platform: rocky-9
    package: calibre
    vars_file: vars/RedHat-9.yml

  - role: office
    platform: rocky-9
    package: texstudio
    vars_file: vars/RedHat-9.yml

  # EL10 EPEL drift — QGIS is packaged in EPEL 9, not in EPEL 10 (#337).
  - role: gis
    platform: rocky-10
    package: qgis
    vars_file: vars/RedHat.yml

  # AUR drift — the release package gplates 2.5.0 does not build against
  # GDAL 3.13; the role installs gplates-git until it does (#337).
  - role: gis
    platform: archlinux
    package: gplates
    source: aur
    vars_file: vars/Archlinux.yml
